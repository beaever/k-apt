services:
  - type: web
    name: kapt-asphalt-collector-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DETAIL_CONCURRENCY
        value: "2"
      - key: PARSE_PROCESSES
        value: "1"
      - key: OCR_ENABLED
        value: "0"
      - key: CORS_ORIGINS
        sync: false
